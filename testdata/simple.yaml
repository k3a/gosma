probes:
  test_http:
    type: http
    url: http://localhost:1122
  test_file:
    type: file
    path: /temp/file
    not_older_than: 20s
  test_socket:
    type: socket
    socket_type: tcp
    address: localhost:1122
  test_ftp:
    type: ftp
    server: ftp.dlptest.com
  test_dns:
    type: dns
    server: 8.8.8.8
    query: google.com
  test_dns_nonexisten_mx:
    type: dns
    server: 8.8.8.8
    query: httpbin.org
    query_type: MX

watchers:
  - type: dashboard
    listen: 0.0.0.0:8080